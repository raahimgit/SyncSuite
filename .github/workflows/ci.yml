name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: synckit
          POSTGRES_PASSWORD: synckit_ci_only
          POSTGRES_DB: synckit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synckit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SYNCKIT_TEST_DATABASE_URL: postgres://synckit:synckit_ci_only@127.0.0.1:5432/synckit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
